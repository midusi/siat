services:
  minio:
    image: minio/minio:latest
    container_name: minio-server
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data # Monta un volumen para persistir los datos
      - ./minio-init:/minio-init
    command: ["/minio-init/minio-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f $MINIO_ENDPOINT_URL/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    networks:
      - traffic_network
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic_backend_api
    command: /app/api-entrypoint.sh
    environment:
      # DB
      DB_DRIVER: "${DB_DRIVER}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      # MinIO
      MINIO_ENDPOINT_URL: "${MINIO_ENDPOINT_URL}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      # JWT & Cookies
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MIN: 60
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: Lax
      AUTH_COOKIE_PATH: /
      AUTH_REFRESH_COOKIE_NAME: refresh_token
      AUTH_REFRESH_COOKIE_SECURE: "false"
      AUTH_REFRESH_COOKIE_SAMESITE: Lax
      AUTH_REFRESH_COOKIE_PATH: /auth
      # Security
      SECRET_KEY: "${SECRET_KEY:-please-change-me}"
      BCRYPT_ROUNDS: 12
      AUTH_RATE_LIMIT_PER_MIN: 10
      AUTH_LOGIN_FAIL_LIMIT: 5
      AUTH_LOGIN_LOCK_MINUTES: 5
      # CORS (allow frontend)
      CORS_ALLOWED_ORIGINS: "${FRONTEND_URL}"
      CORS_ALLOW_CREDENTIALS: "true"
      # Email/Reset
      RESET_TOKEN_EXPIRES_MIN: 30
      EMAIL_FROM: no-reply@example.com
      EMAIL_STUB: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f $BACKEND_URL/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    networks:
      - traffic_network
    volumes:
      - model_weights:/app/app/modelo

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic_backend_worker
    command: /app/worker-entrypoint.sh
    environment:
      # DB
      DB_DRIVER: postgresql+psycopg2
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      # MinIO
      MINIO_ENDPOINT_URL: "${MINIO_ENDPOINT_URL}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      # Security
      SECRET_KEY: "${SECRET_KEY:-please-change-me}"
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    healthcheck:
      test: ["CMD-SHELL", "curl -f $BACKEND_URL/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    networks:
      - traffic_network
    volumes:
      - model_weights:/app/app/modelo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic_frontend
    environment:
      BACKEND_URL: ${BACKEND_URL}
      MINIO_URL: ${MINIO_ENDPOINT_URL_SSL}
      ORIGIN: "${FRONTEND_URL}"
      BODY_SIZE_LIMIT: 104857600 # 100MB in bytes for video uploads
    networks:
      - traffic_network

networks:
  traffic_network:
    driver: bridge

volumes:
  minio_data:
  model_weights:


